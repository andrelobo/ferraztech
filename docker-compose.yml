services:
  backend:
    build:
      context: ./backend
      target: ${BUILD_TARGET:-development}
    container_name: ferraztech-backend
    restart: always
    env_file: .env
    ports:
      - "${WATA_HTTP_PORT:-3001}:3000"
    volumes:
      - ./data/whatsapp-sessions:/app/sessions
    profiles:
      - production
      - development

  admin:
    build:
      context: ./admin
      target: ${BUILD_TARGET:-development}
    container_name: ferraztech-admin
    ports:
      - "5173:5173"
    profiles:
      - development

  nginx:
    image: nginx:alpine
    container_name: ferraztech-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./admin/dist:/usr/share/nginx/html
    depends_on:
      - backend
    profiles:
      - production
